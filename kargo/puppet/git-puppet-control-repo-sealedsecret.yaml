# Kargo's GitHub token for puppet-control-repo, encrypted with Sealed Secrets.
# Generated by scripts/seal-kargo-secrets.sh - only this cluster can decrypt it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: git-puppet-control-repo
  namespace: puppet
spec:
  encryptedData:
    password: 
    repoURL: 
    username: 
  template:
    metadata:
      labels:
        kargo.akuity.io/cred-type: git
      name: git-puppet-control-repo
      namespace: puppet
