# Image pull secret for Harbor in sample-app-dev, encrypted with Sealed Secrets.
# Generated by scripts/seal-kargo-secrets.sh - only this cluster can decrypt it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-pull
  namespace: sample-app-dev
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: harbor-pull
      namespace: sample-app-dev
    type: kubernetes.io/dockerconfigjson
