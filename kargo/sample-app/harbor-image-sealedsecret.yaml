# Kargo's Harbor credentials for the sample-app Warehouse, encrypted with Sealed Secrets.
# Generated by scripts/seal-kargo-secrets.sh - only this cluster can decrypt it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-image
  namespace: sample-app
spec:
  encryptedData:
    password: 
    repoURL: 
    username: 
  template:
    metadata:
      labels:
        kargo.akuity.io/cred-type: image
      name: harbor-image
      namespace: sample-app
