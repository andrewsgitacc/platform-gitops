# Kargo's GitHub token for sample-app-deploy, encrypted with Sealed Secrets.
# Generated by scripts/seal-kargo-secrets.sh - only this cluster can decrypt it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: git-sample-app-deploy
  namespace: sample-app
spec:
  encryptedData:
    password: 
    repoURL: 
    username: 
  template:
    metadata:
      labels:
        kargo.akuity.io/cred-type: git
      name: git-sample-app-deploy
      namespace: sample-app
