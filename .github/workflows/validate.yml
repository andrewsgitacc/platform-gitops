# Validate every platform component on pull requests and pushes to main:
#  - render each Helm chart with its pinned version and values (CRDs included)
#  - turn the CRDs from those pinned charts into JSON schemas, so custom resources
#    (CephCluster, Gateway, Certificate, ...) are checked against exactly the versions
#    Argo CD deploys - community schema catalogs lag behind new releases
#  - schema-check the rendered charts and all plain manifests with kubeconform
# Runs on GitHub-hosted runners; it never touches the lab.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.7.0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # An empty or truncated sealed file would make Argo CD delete the secret (prune).
      - name: Sealed secrets are complete
        run: |
          set -euo pipefail
          bad=0
          for f in $(git ls-files '*sealedsecret*.yaml'); do
            if ! grep -q '^kind: SealedSecret' "$f" || ! grep -q 'encryptedData:' "$f"; then
              echo "::error file=$f::not a complete SealedSecret (empty or truncated?)"; bad=1
            fi
          done
          exit $bad

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Render Helm charts
        run: |
          set -euo pipefail
          mkdir -p rendered
          for dir in components/*/; do
            c=$(basename "$dir")
            repo=$(yq '.repo' "$dir/chart.yaml"); chart=$(yq '.chart' "$dir/chart.yaml")
            version=$(yq '.version' "$dir/chart.yaml"); ns=$(yq '.namespace' "$dir/chart.yaml")
            release=$(yq '.release' "$dir/chart.yaml")
            if [[ "$repo" == oci://* ]]; then ref="$repo/$chart"; args=(); else ref="$chart"; args=(--repo "$repo"); fi
            echo "::group::$c ($chart $version)"
            helm template "$release" "$ref" "${args[@]}" --version "$version" \
              --namespace "$ns" --values "$dir/values.yaml" --include-crds > "rendered/$c.yaml"
            echo "rendered $(grep -c '^kind:' "rendered/$c.yaml") resources"
            echo "::endgroup::"
          done

      - name: Schemas from the pinned charts' CRDs
        run: |
          set -euo pipefail
          # PyYAML for the converter (newer Ubuntu runners refuse plain system pip installs)
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet --break-system-packages pyyaml
          curl -sSLf -o openapi2jsonschema.py \
            "https://raw.githubusercontent.com/yannh/kubeconform/${KUBECONFORM_VERSION}/scripts/openapi2jsonschema.py"
          mkdir -p schemas
          cd schemas
          FILENAME_FORMAT='{fullgroup}-{kind}_{version}' python3 ../openapi2jsonschema.py ../rendered/*.yaml > /dev/null
          echo "generated $(ls | wc -l) schemas from $(cat ../rendered/*.yaml | grep -c '^kind: CustomResourceDefinition' || true) CRDs"

      # Schema lookup order: Kubernetes built-ins, then our charts' CRDs, then the
      # community catalog for anything else.
      - name: kubeconform
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'schemas/{{.Group}}-{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            rendered/ components/*/manifests/ apps/ argocd/ bootstrap/ kargo/
