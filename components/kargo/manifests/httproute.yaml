# Kargo UI, API and CLI at https://kargo.apps.lab.local (DNS + TLS via lab-gateway).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kargo-api
  namespace: kargo
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - kargo.apps.lab.local
  rules:
    - backendRefs:
        - name: kargo-api
          port: 80
