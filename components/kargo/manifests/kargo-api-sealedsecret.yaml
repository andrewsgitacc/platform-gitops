# Kargo's admin account, encrypted with Sealed Secrets.
# Generated by scripts/seal-kargo-secrets.sh - only this cluster can decrypt it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: kargo-api
  namespace: kargo
spec:
  encryptedData:
    ADMIN_ACCOUNT_PASSWORD_HASH: 
    ADMIN_ACCOUNT_TOKEN_SIGNING_KEY: 
  template:
    metadata:
      name: kargo-api
      namespace: kargo
