# Renovate's GitHub token, encrypted with Sealed Secrets.
# Generated by scripts/seal-ci-secrets.sh - only this cluster can decrypt it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: renovate-token
  namespace: renovate
spec:
  encryptedData:
    RENOVATE_TOKEN: 
  template:
    metadata:
      name: renovate-token
      namespace: renovate
