# Argo CD: deploys everything in this repo and manages itself (see argocd/ and bootstrap/).
global:
  domain: argocd.apps.lab.local

configs:
  params:
    # TLS is terminated at lab-gateway (Envoy), which talks plain HTTP to argocd-server.
    server.insecure: true
    # Compare Git with the cluster server-side (a dry-run apply), so fields Kubernetes
    # fills in by default - e.g. on Gateway API objects: backendRefs kind/weight, path
    # matches - aren't reported as OutOfSync. Recommended with ServerSideApply.
    controller.diff.server.side: "true"

  cm:
    # Webhook/CRD CA bundles are injected at runtime (by cert-manager's cainjector,
    # MetalLB, Envoy Gateway). They aren't in Git, so tell Argo CD not to treat them as drift.
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_MutatingWebhookConfiguration: |
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jqPathExpressions:
        - '.spec.conversion.webhook.clientConfig.caBundle'

    # Single sign-on with Keycloak (Phase 7): "LOG IN VIA KEYCLOAK" on the login page.
    # The client secret comes from the SealedSecret argocd-oidc-keycloak
    # (manifests/argocd-oidc-sealedsecret.yaml). The built-in admin user stays enabled for
    # the CLI and as a way in if Keycloak is down.
    oidc.config: |
      name: Keycloak
      issuer: https://keycloak.apps.lab.local/realms/platform
      clientID: argocd
      clientSecret: $argocd-oidc-keycloak:clientSecret
      requestedScopes: ["openid", "profile", "email"]
      logoutURL: https://keycloak.apps.lab.local/realms/platform/protocol/openid-connect/logout?id_token_hint={{token}}&post_logout_redirect_uri={{logoutRedirectURL}}

  # Keycloak group platform-admins = Argo CD admin. Other Keycloak users get no access.
  rbac:
    scopes: "[groups]"
    policy.default: ""
    policy.csv: |
      g, platform-admins, role:admin

  # Charts published as OCI artifacts (Envoy Gateway, ARC): Argo CD needs each registry
  # registered with OCI enabled (no credentials - they're public).
  repositories:
    envoyproxy-oci:
      name: envoyproxy
      url: registry-1.docker.io/envoyproxy
      type: helm
      enableOCI: "true"
    # GitHub Actions Runner Controller charts (Phase 9), on GitHub's OCI registry.
    arc-oci:
      name: actions-runner-controller-charts
      url: ghcr.io/actions/actions-runner-controller-charts
      type: helm
      enableOCI: "true"

# Single sign-on is Keycloak's OIDC directly (configs.cm oidc.config), so no Dex.
dex:
  enabled: false

notifications:
  enabled: false

# Metrics for Prometheus (Phase 6): sync status, health, Git and API activity.
controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
server:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  # Trust the lab CA when talking to https://keycloak.apps.lab.local: the lab-ca-bundle
  # ConfigMap (public CAs + lab CA) comes from trust-manager (components/trust-manager).
  # Optional, so argocd-server still starts on a fresh cluster before trust-manager runs.
  env:
    - name: SSL_CERT_FILE
      value: /etc/ssl/lab/ca-certificates.crt
  volumes:
    - name: lab-ca-bundle
      configMap:
        name: lab-ca-bundle
        optional: true
  volumeMounts:
    - name: lab-ca-bundle
      mountPath: /etc/ssl/lab
      readOnly: true
repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
