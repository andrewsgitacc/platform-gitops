# Argo CD UI and CLI at https://argocd.apps.lab.local (DNS + TLS via lab-gateway).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: lab-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - argocd.apps.lab.local
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
