# Keycloak realm secrets (OIDC client secrets, the admin user's password), encrypted with Sealed Secrets.
# Generated by scripts/seal-keycloak-secrets.sh - only this cluster can decrypt it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-realm-secrets
  namespace: keycloak
spec:
  encryptedData:
    admin-password: 
    argocd-client-secret: 
    grafana-client-secret: 
  template:
    metadata:
      name: keycloak-realm-secrets
      namespace: keycloak
