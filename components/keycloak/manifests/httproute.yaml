# Keycloak (login pages, admin console) at https://keycloak.apps.lab.local.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
    - {name: lab-gateway, namespace: envoy-gateway-system, sectionName: https}
  hostnames: [keycloak.apps.lab.local]
  rules:
    - backendRefs:
        - {name: keycloak-http, port: 80}
