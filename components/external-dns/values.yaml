# Creates DNS records in apps.lab.local on the lab BIND server (dns.lab.local)
# for every HTTPRoute hostname, using signed RFC2136 dynamic updates.
provider:
  name: rfc2136

# TSIG secret comes from a Kubernetes Secret, not Git
# (created by scripts/create-external-dns-secret.sh; moved to Sealed Secrets in Phase 4).
env:
  - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
    valueFrom:
      secretKeyRef:
        name: external-dns-rfc2136
        key: tsig-secret

extraArgs:
  - --rfc2136-host=172.16.79.10
  - --rfc2136-port=53
  - --rfc2136-zone=apps.lab.local
  - --rfc2136-tsig-keyname=externaldns-key
  - --rfc2136-tsig-secret-alg=hmac-sha256
  - --rfc2136-axfr
  - --rfc2136-min-ttl=60s

sources:
  - gateway-httproute

domainFilters:
  - apps.lab.local

policy: sync          # also delete records when routes are removed
registry: txt         # TXT ownership records, so it never touches records it didn't create
txtOwnerId: k8s-lab
interval: 1m
