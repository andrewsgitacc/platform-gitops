# S3 bucket "loki-data" in Ceph for Loki's log data. Rook creates the bucket and a
# Secret "loki-bucket" (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) in this namespace.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: loki-bucket
  namespace: monitoring
spec:
  bucketName: loki-data
  storageClassName: ceph-bucket
