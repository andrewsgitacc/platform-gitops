# Metrics, alerting and dashboards for the platform. Data on Ceph (ceph-block).

crds:
  enabled: true

prometheusOperator:
  # Use cert-manager for the operator's admission webhook certificate instead of
  # Helm hook jobs (cleaner under Argo CD).
  admissionWebhooks:
    certManager:
      enabled: true

prometheus:
  prometheusSpec:
    externalUrl: https://prometheus.apps.lab.local
    retention: 7d
    retentionSize: 12GB
    # Pick up ServiceMonitors / PodMonitors / rules from every namespace and chart,
    # not only those labelled for this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 2Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-block
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 15Gi

alertmanager:
  alertmanagerSpec:
    externalUrl: https://alertmanager.apps.lab.local
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 256Mi}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-block
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi

grafana:
  adminUser: admin
  adminPassword: admin          # LAB ONLY: local login, kept as a way in if Keycloak is down
  # Single sign-on with Keycloak (Phase 7): client secret from the SealedSecret
  # grafana-oidc-keycloak (manifests/grafana-oidc-sealedsecret.yaml). Optional, so Grafana
  # still starts without it (only the Keycloak login fails).
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oidc-keycloak
        key: client-secret
        optional: true
  # Trust the lab CA when Grafana calls https://keycloak.apps.lab.local (token, userinfo).
  # lab-ca-bundle comes from trust-manager (components/trust-manager).
  env:
    SSL_CERT_FILE: /etc/ssl/lab/ca-certificates.crt
  extraConfigmapMounts:
    - name: lab-ca-bundle
      configMap: lab-ca-bundle
      mountPath: /etc/ssl/lab
      readOnly: true
      optional: true
  deploymentStrategy:
    type: Recreate              # single pod with a ReadWriteOnce volume
  persistence:
    enabled: true
    storageClassName: ceph-block
    size: 1Gi
  grafana.ini:
    server:
      root_url: https://grafana.apps.lab.local
    security:
      # LAB ONLY: don't lock the admin account after repeated wrong passwords (Grafana
      # otherwise blocks it for 5 minutes, which also blocks scripts/curl using admin).
      # Never set this on an internet-facing Grafana.
      disable_brute_force_login_protection: true
    # "Sign in with Keycloak". Keycloak group platform-admins = Grafana Admin, other
    # Keycloak users = Viewer. The admin/admin form login stays available.
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      scopes: openid email profile
      auth_url: https://keycloak.apps.lab.local/realms/platform/protocol/openid-connect/auth
      token_url: https://keycloak.apps.lab.local/realms/platform/protocol/openid-connect/token
      api_url: https://keycloak.apps.lab.local/realms/platform/protocol/openid-connect/userinfo
      signout_redirect_url: https://keycloak.apps.lab.local/realms/platform/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgrafana.apps.lab.local%2Flogin
      use_pkce: true
      use_refresh_token: true
      login_attribute_path: preferred_username
      email_attribute_path: email
      name_attribute_path: name
      groups_attribute_path: groups
      role_attribute_path: contains(groups[*], 'platform-admins') && 'Admin' || 'Viewer'
  # Logs from Loki (components/loki), next to the Prometheus data source.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki-gateway.monitoring.svc
      access: proxy
  # Platform dashboards: Ceph's own dashboards from the Ceph source at the SAME version we
  # run (keep the tag in step with Ceph, see components/rook-ceph-cluster), and Argo CD's
  # from grafana.com. (The old grafana.com Ceph dashboards use pre-v20 metric names.)
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: platform
          orgId: 1
          folder: Platform
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/platform
  dashboards:
    platform:
      ceph-cluster:
        url: https://raw.githubusercontent.com/ceph/ceph/v20.2.4/monitoring/ceph-mixin/dashboards_out/ceph-cluster-advanced.json
      ceph-osds:
        url: https://raw.githubusercontent.com/ceph/ceph/v20.2.4/monitoring/ceph-mixin/dashboards_out/osds-overview.json
      ceph-pools:
        url: https://raw.githubusercontent.com/ceph/ceph/v20.2.4/monitoring/ceph-mixin/dashboards_out/pool-overview.json
      argocd:
        gnetId: 14584
        datasource: Prometheus

# kubeadm runs etcd, the scheduler, the controller-manager and kube-proxy with their
# metrics on 127.0.0.1 only, so Prometheus can't scrape them and their alerts would
# fire permanently (TargetDown). Off for the lab; exposing them means changing the
# kubeadm config (Phase 11).
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
