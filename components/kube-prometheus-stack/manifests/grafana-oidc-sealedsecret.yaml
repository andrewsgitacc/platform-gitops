# Grafana's Keycloak client secret, encrypted with Sealed Secrets.
# Generated by scripts/seal-keycloak-secrets.sh - only this cluster can decrypt it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-oidc-keycloak
  namespace: monitoring
spec:
  encryptedData:
    client-secret: 
  template:
    metadata:
      name: grafana-oidc-keycloak
      namespace: monitoring
