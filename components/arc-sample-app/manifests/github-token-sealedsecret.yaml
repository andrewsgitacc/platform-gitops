# ARC's GitHub token for sample-app, encrypted with Sealed Secrets.
# Generated by scripts/seal-ci-secrets.sh - only this cluster can decrypt it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: arc-github-token
  namespace: arc-runners
spec:
  encryptedData:
    github_token: 
  template:
    metadata:
      name: arc-github-token
      namespace: arc-runners
