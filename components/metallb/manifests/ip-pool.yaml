# LoadBalancer IPs, reserved in labs/platform/README.md (IP plan).
# Fusion's DHCP range is .128-.254, so the pool stays well below it.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lab-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.16.79.100-172.16.79.119
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - lab-pool
