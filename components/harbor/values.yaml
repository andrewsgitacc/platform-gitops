# Harbor container registry at https://harbor.apps.lab.local
#   - database: CloudNativePG cluster harbor-db (manifests/database.yaml)
#   - images: Ceph S3 bucket harbor-registry (manifests/bucket.yaml)
#   - login: Keycloak (OIDC), group platform-admins = Harbor admins
#   - secrets: SealedSecrets harbor-secrets / harbor-token (scripts/seal-harbor-secrets.sh)
#
# IMAGES: Harbor's first release with arm64 images is v2.16.0 (v2.15.x is amd64 only), and
# only its release candidate exists yet. Chart 1.19.4 is made for v2.15.4, so every image
# tag is overridden to v2.16.0-rc1 below. When v2.16.0 and a chart for it are released,
# move to them and drop the overrides.

externalURL: https://harbor.apps.lab.local

# Gateway API route on lab-gateway; TLS ends at the gateway.
expose:
  type: route
  tls:
    enabled: false
  route:
    parentRefs:
      - name: lab-gateway
        namespace: envoy-gateway-system
        sectionName: https
    hosts:
      - harbor.apps.lab.local

# ---- Secrets: all from SealedSecrets, never generated by the chart ----------------------
# The chart would otherwise make random values (and a random token certificate) on every
# render, which under Argo CD means new secrets on every sync.
existingSecretAdminPassword: harbor-secrets   # HARBOR_ADMIN_PASSWORD (local "admin" login)
existingSecretSecretKey: harbor-secrets       # secretKey: encryption key for stored credentials
caBundleSecretName: harbor-ca-bundle          # lab root CA, from trust-manager

core:
  image: {tag: v2.16.0-rc1}
  existingSecret: harbor-secrets              # secret
  secretName: harbor-token                    # tls.crt / tls.key for registry tokens
  existingXsrfSecret: harbor-secrets          # CSRF_KEY
  # Keycloak login (auth_mode oidc_auth etc.), applied by Harbor at start-up. JSON in the
  # SealedSecret because it contains the OIDC client secret.
  extraEnvVars:
    - name: CONFIG_OVERWRITE_JSON
      valueFrom:
        secretKeyRef: {name: harbor-secrets, key: CONFIG_OVERWRITE_JSON}

jobservice:
  image: {tag: v2.16.0-rc1}
  existingSecret: harbor-secrets              # JOBSERVICE_SECRET

portal:
  image: {tag: v2.16.0-rc1}

registry:
  existingSecret: harbor-secrets              # REGISTRY_HTTP_SECRET
  credentials:
    username: harbor_registry_user
    existingSecret: harbor-secrets            # REGISTRY_PASSWD / REGISTRY_HTPASSWD
  registry:
    image: {tag: v2.16.0-rc1}
    extraEnvVars: &s3Credentials
      # S3 keys from the bucket claim's Secret (manifests/bucket.yaml)
      - name: REGISTRY_STORAGE_S3_ACCESSKEY
        valueFrom:
          secretKeyRef: {name: harbor-bucket, key: AWS_ACCESS_KEY_ID}
      - name: REGISTRY_STORAGE_S3_SECRETKEY
        valueFrom:
          secretKeyRef: {name: harbor-bucket, key: AWS_SECRET_ACCESS_KEY}
      - name: REGISTRY_STORAGE_S3_FORCEPATHSTYLE   # Ceph RGW: bucket in the path
        value: "true"
  controller:
    image: {tag: v2.16.0-rc1}
    extraEnvVars: *s3Credentials              # garbage collection reads the same storage

trivy:
  image: {tag: v2.16.0-rc1}

exporter:
  image: {tag: v2.16.0-rc1}

# ---- Storage -----------------------------------------------------------------------------
persistence:
  enabled: true
  persistentVolumeClaim:
    jobservice:
      jobLog: {storageClass: ceph-block, size: 1Gi}
    redis: {storageClass: ceph-block, size: 1Gi}
    trivy: {storageClass: ceph-block, size: 5Gi}      # vulnerability database cache
  imageChartStorage:
    # Clients download layers through Harbor, not by redirect to the in-cluster S3 address.
    disableredirect: true
    type: s3
    s3:
      region: us-east-1
      bucket: harbor-registry
      regionendpoint: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc
      rootdirectory: /registry
      v4auth: true

# PostgreSQL from CloudNativePG (database "registry", owner "harbor").
database:
  type: external
  external:
    host: harbor-db-rw
    port: "5432"
    username: harbor
    coreDatabase: registry
    existingSecret: harbor-db-app   # created by CloudNativePG, key "password"
    sslmode: require

# Valkey (Redis-compatible) cache and job queue, run by the chart.
redis:
  type: internal
  internal:
    image: {tag: v2.16.0-rc1}

# Prometheus metrics (Phase 6): core, registry, jobservice and the exporter.
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
