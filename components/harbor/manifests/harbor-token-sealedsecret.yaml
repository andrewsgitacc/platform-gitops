# Harbor's registry token signing certificate, encrypted with Sealed Secrets.
# Generated by scripts/seal-harbor-secrets.sh - only this cluster can decrypt it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-token
  namespace: harbor
spec:
  encryptedData:
    tls.crt: 
    tls.key: 
  template:
    metadata:
      name: harbor-token
      namespace: harbor
