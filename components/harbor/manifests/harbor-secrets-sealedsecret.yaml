# Harbor's secrets, encrypted with Sealed Secrets.
# Generated by scripts/seal-harbor-secrets.sh - only this cluster can decrypt it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-secrets
  namespace: harbor
spec:
  encryptedData:
    CONFIG_OVERWRITE_JSON: 
    CSRF_KEY: 
    HARBOR_ADMIN_PASSWORD: 
    JOBSERVICE_SECRET: 
    REGISTRY_HTPASSWD: 
    REGISTRY_HTTP_SECRET: 
    REGISTRY_PASSWD: 
    secret: 
    secretKey: 
  template:
    metadata:
      name: harbor-secrets
      namespace: harbor
